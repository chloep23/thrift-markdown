<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a4e"/>
      <stop offset="1" stop-color="#7a2f1c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- A second tag behind the first: the rest of the rack. -->
  <g transform="rotate(-45 32 32) translate(6 -6)" fill="#fff" opacity="0.3">
    <rect x="17" y="17" width="30" height="30" rx="5"/>
  </g>
  <!-- The tag itself, a square turned on its point, its string hole at the left corner. -->
  <g transform="rotate(-45 32 32)">
    <rect x="17" y="17" width="30" height="30" rx="5" fill="#fff" opacity="0.95"/>
    <circle cx="24" cy="24" r="3.4" fill="#7a2f1c"/>
  </g>
  <!-- The markdown. -->
  <g stroke="#7a2f1c" fill="none" stroke-width="2.8" stroke-linecap="round">
    <line x1="26.5" y1="41" x2="41" y2="26.5"/>
    <circle cx="27.5" cy="28" r="2.9"/>
    <circle cx="40" cy="39.5" r="2.9"/>
  </g>
</svg>
